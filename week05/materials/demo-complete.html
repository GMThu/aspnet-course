<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第五週成功路線 Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#08131f;color:#f7f4ea;font-family:system-ui,sans-serif}.shell{width:min(900px,calc(100% - 28px));margin:30px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#102338;border:1px solid #35516a;border-radius:16px;padding:22px}label{display:block;margin-top:12px}input,select,textarea,button{width:100%;padding:12px;margin-top:6px;font:inherit}button{background:#68d9d0;border:0;font-weight:800;margin-top:18px}.ok{border-color:#9de09b}.note{color:#b8c9d8}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><p class="note">預期行為 Demo：只示範第五週「收到與回應」，不是 ASP.NET 執行證據。</p><div class="grid"><form class="card" id="f"><h1>活動報名</h1><label>顯示名稱<input id="name" value="小安"></label><label>Email<input id="email" value="student@example.com"></label><label>場次<select id="session"><option>週三晚上</option><option>週六下午</option></select></label><button>送出報名</button></form><section class="card ok" id="out"><h2>等待送出</h2><p>換一組資料再送一次，摘要也要跟著變。</p></section></div></main><script>document.getElementById('f').onsubmit=e=>{e.preventDefault();document.getElementById('out').innerHTML=`<h2>報名資料已收到</h2><p>參加者：<strong>${document.getElementById('name').value}</strong></p><p>Email：<strong>${document.getElementById('email').value}</strong></p><p>場次：<strong>${document.getElementById('session').value}</strong></p><p>本週尚未驗證，也未寫入資料庫。</p>`}</script></body></html>
