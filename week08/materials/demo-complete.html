<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>第八週｜查詢結果互動示意</title><style> :root{color-scheme:dark;--bg:#07151a;--ink:#f8f4e8;--line:#37616a;--cyan:#64ddd2;--lime:#dcf58f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.8}main{width:min(1050px,calc(100% - 40px));margin:auto;padding:38px 0 80px}h1{font-size:clamp(32px,5vw,52px);line-height:1.25}h2{margin-top:38px;color:var(--lime)}a{color:var(--cyan)}.card,.note,.warning,.callout{padding:20px;border:1px solid var(--line);background:#102a31;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid.three{grid-template-columns:repeat(3,1fr)}table{width:100%;border-collapse:collapse}td,th{padding:12px;border:1px solid var(--line);text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#020d10;padding:20px;font:16px/1.6 ui-monospace,Consolas,monospace}button,.action{display:inline-block;padding:10px 16px;border:1px solid var(--line);background:#173a42;color:var(--ink);font:inherit;cursor:pointer;border-radius:6px}.actions{display:flex;gap:12px;flex-wrap:wrap}summary{cursor:pointer;color:var(--cyan)}input,select{padding:10px;font:inherit}.checklist label{display:block;margin:12px 0}button:focus-visible,a:focus-visible{outline:3px solid var(--lime);outline-offset:4px}.timer strong{font:700 60px ui-monospace,monospace;color:var(--lime)}@media(max-width:700px){.grid,.grid.three{grid-template-columns:1fr}table{display:block;overflow:auto}main{width:calc(100% - 32px)}} </style></head><body><main><h1>第八週｜查詢結果互動示意</h1><p class="warning">瀏覽器教學示意：下表是固定假資料，沒有連線 SQL Server，也不執行真正的 SQL。實作驗收請在 SSMS 完成。</p><label>篩選場次 <select id="filter"><option value="">全部</option><option>上午場</option><option>下午場</option><option>不存在的場次</option></select></label> <label>Id 排序 <select id="sort"><option value="ASC">ASC 小到大</option><option value="DESC">DESC 大到小</option></select></label><pre id="query"></pre><p id="count" role="status"></p><table><thead><tr><th>Id</th><th>DisplayName</th><th>Session</th></tr></thead><tbody id="rows"></tbody></table><p>改 WHERE 只改查詢結果，不刪除原本資料。重新選「全部」可再次看到三筆。</p><p><a href="start-here.html">逐步操作指南</a> · <a href="https://gmthu.github.io/aspnet-course/week08/index.html">回第八週</a></p></main><script>const data=[{Id:1,DisplayName:'小安',Session:'上午場'},{Id:2,DisplayName:'小晴',Session:'下午場'},{Id:3,DisplayName:'小宇',Session:'上午場'}];const filter=document.getElementById('filter'),sort=document.getElementById('sort');function render(){const rows=data.filter(x=>!filter.value||x.Session===filter.value).sort((a,b)=>sort.value==='ASC'?a.Id-b.Id:b.Id-a.Id);document.getElementById('query').textContent='SELECT Id, DisplayName, Session\nFROM dbo.Registrations'+(filter.value?"\nWHERE Session = N'"+filter.value+"'":'')+'\nORDER BY Id '+sort.value+';';document.getElementById('rows').replaceChildren(...rows.map(row=>{const tr=document.createElement('tr');Object.values(row).forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.append(td)});return tr}));document.getElementById('count').textContent=`查詢結果：${rows.length} 列（原資料仍是 3 列）`}filter.onchange=sort.onchange=render;render();</script></body></html>
