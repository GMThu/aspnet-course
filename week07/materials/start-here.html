<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>第七週｜期中報告準備</title><style> :root{color-scheme:dark;--bg:#07151a;--ink:#f8f4e8;--line:#37616a;--cyan:#64ddd2;--lime:#dcf58f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.8}main{width:min(1050px,calc(100% - 40px));margin:auto;padding:38px 0 80px}h1{font-size:clamp(32px,5vw,52px);line-height:1.25}h2{margin-top:38px;color:var(--lime)}a{color:var(--cyan)}.card,.note,.warning,.callout{padding:20px;border:1px solid var(--line);background:#102a31;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid.three{grid-template-columns:repeat(3,1fr)}table{width:100%;border-collapse:collapse}td,th{padding:12px;border:1px solid var(--line);text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#020d10;padding:20px;font:16px/1.6 ui-monospace,Consolas,monospace}button,.action{display:inline-block;padding:10px 16px;border:1px solid var(--line);background:#173a42;color:var(--ink);font:inherit;cursor:pointer;border-radius:6px}.actions{display:flex;gap:12px;flex-wrap:wrap}summary{cursor:pointer;color:var(--cyan)}input,select{padding:10px;font:inherit}.checklist label{display:block;margin:12px 0}button:focus-visible,a:focus-visible{outline:3px solid var(--lime);outline-offset:4px}.timer strong{font:700 60px ui-monospace,monospace;color:var(--lime)}@media(max-width:700px){.grid,.grid.three{grid-template-columns:1fr}table{display:block;overflow:auto}main{width:calc(100% - 32px)}} </style></head><body><main><h1>第七週｜期中報告準備</h1><p>發揮創意，用任何形式提出期末專題的提案計畫。請說明使用者問題、解決構想、使用情境、核心功能、分工與進度，以及待確認事項。</p><p>簡報、海報、草圖、角色扮演、影片、原型或其他形式皆可；不要求已完成網站、程式或資料庫串接。報告時間、順序與繳交方式依老師公告。</p><div class="actions"><a class="action secondary" href="report-outline.txt">提案計畫大綱</a><a class="action secondary" href="test-record.txt">提案檢核與回饋表</a><a class="action secondary" href="https://gmthu.github.io/aspnet-course/week07/index.html">回期中報告簡報</a><a class="action secondary" href="https://gmthu.github.io/aspnet-course/week08/">第八週 SQL 入門</a></div></main><script></script></body></html>
