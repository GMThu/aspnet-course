<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小安的活動網站｜第四週備用練習</title>
  <link rel="stylesheet" href="bootstrap-practice.css">
</head>
<body>
  <!--
    純 HTML 備用路線：這不是 ASP.NET，也不是完整 Bootstrap。
    回到 ASP.NET 專案時，圖片路徑要改成 /images/campus-night.svg。
  -->
  <div class="container py-4">
    <section class="activity-hero p-4 mb-4">
      <p class="activity-kicker">校園活動</p>
      <h1>東海夜間攝影</h1>
      <p>一起探索夜晚的東海校園，新手也能參加。</p>
    </section>

    <div class="card shadow-sm mb-4 activity-card">
      <img src="images/campus-night.svg"
           class="card-img-top img-fluid"
           alt="月光下的東海校園步道與拿著相機的學生">

      <div class="card-body">
        <h2 class="card-title">活動介紹</h2>
        <p class="card-text">我們會從路思義教堂出發，練習觀察光線與構圖。</p>

        <h2 class="h4 mt-4">攜帶物品</h2>
        <ul>
          <li>手機或相機</li>
          <li>飲用水</li>
          <li>請自行增加一項</li>
        </ul>

        <a class="btn btn-primary mt-2" href="https://gmthu.github.io/aspnet-course/">
          查看課程首頁
        </a>
      </div>
    </div>

    <div class="alert alert-warning" role="alert">
      活動提醒：集合前請先確認當天天氣。
    </div>
  </div>
</body>
</html>
